<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Payment confirmation | The Eyes of Ghana</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="hero" style="min-height:100vh;display:grid;place-items:center;text-align:center;padding:32px 20px">
    <div>
      <p class="eyebrow">THE EYES OF GHANA</p>
      <h1 style="font-size:clamp(42px,6vw,70px)">Your book is<br><em>almost ready.</em></h1>
      <p id="status" class="hero-lede" style="margin:0 auto 24px">Please wait while we confirm your payment securely with Paystack.</p>
      <a id="download" class="button button-gold" href="#" hidden>DOWNLOAD THE EBOOK ↓</a>
      <p id="expiry" class="hero-lede" hidden style="margin:18px auto 0">This secure download link is valid for 15 minutes. Save your PDF after downloading.</p>
      <p class="hero-lede" style="margin:24px auto 0">Need help? Email <a href="mailto:kwamejoshua703@gmail.com">kwamejoshua703@gmail.com</a>.</p>
      <a class="button" href="/" style="margin-top:28px">Return to book page →</a>
    </div>
  </main>
  <script>
  (async () => {
    const params = new URLSearchParams(location.search);
    const ref = params.get("reference") || params.get("trxref");
    const status = document.querySelector("#status");
    const button = document.querySelector("#download");
    const expiry = document.querySelector("#expiry");
    if (!ref) {
      status.textContent = "No payment reference was provided. If you were charged, please contact the publisher.";
      return;
    }
    try {
      const response = await fetch("/.netlify/functions/verify-payment?reference=" + encodeURIComponent(ref), {
        cache: "no-store"
      });
      const data = await response.json();
      if (!response.ok || !data.verified || !data.download_url) {
        status.textContent = data.message || data.error || "We could not confirm your payment. If you were charged, please contact the publisher.";
        return;
      }
      status.textContent = data.message;
      button.href = data.download_url;
      button.hidden = false;
      expiry.hidden = false;
    } catch {
      status.textContent = "We could not check your payment right now. Please refresh this page in a moment.";
    }
  })();
  </script>
</body>
</html>
