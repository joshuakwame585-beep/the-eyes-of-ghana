<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment status | The Eyes of Ghana</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="hero" style="min-height:100vh;display:grid;place-items:center;text-align:center"><div><p class="eyebrow">THE EYES OF GHANA</p><h1 style="font-size:clamp(42px,6vw,70px)">Checking your<br><em>payment.</em></h1><p id="status" class="hero-lede" style="margin:0 auto">Please wait while we confirm your transaction with Paystack.</p><p class="hero-lede">Need help? Email <a href="mailto:kwamejoshua703@gmail.com">kwamejoshua703@gmail.com</a>.</p><a class="button button-gold" href="/" style="margin-top:28px">Return to book page →</a></div></main><script>
(async()=>{const ref=new URLSearchParams(location.search).get("reference");const el=document.querySelector("#status");if(!ref){el.textContent="No payment reference was provided. Please contact the publisher if you were charged.";return;}try{const r=await fetch("/.netlify/functions/verify-payment?reference="+encodeURIComponent(ref));const d=await r.json();el.textContent=d.message||d.error||"We could not confirm the payment. Please contact support."; }catch{el.textContent="We could not check the payment right now. Please contact support before trying again.";}})();
</script></body></html>
